[package]
name = "ielts-vocabulary"
version = "1.0.0"
edition = "2021"

[dependencies]
wry = { path = "vendor/wry-753e11129c1781498e6a7f01a14628db5a3550a1" }
tao = "0.35"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
